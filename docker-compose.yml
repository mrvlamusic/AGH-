services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cubpay
      POSTGRES_PASSWORD: cubpay
      POSTGRES_DB: cubpay
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cubpay_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubpay"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cubpay_postgres:
