services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cubpay
      POSTGRES_PASSWORD: cubpay
      POSTGRES_DB: cubpay
    ports:
      - "5432:5432"
    volumes:
      - cubpay_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  cubpay_pg:
